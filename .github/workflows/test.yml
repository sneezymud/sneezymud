name: Build and Test
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    name: Build and Test
    steps:
      - name: Checkout this commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure cache settings
        uses: ./.github/actions/setup-cmake-cache

      - name: Install dependencies
        uses: ./.github/actions/install-build-deps
        with:
          extra-packages: mariadb-server

      - name: Verify, configure, and seed a test database
        run: |
          set -e
          sudo systemctl is-active --quiet mariadb || sudo systemctl start mariadb
          sudo mariadb -e "create database sneezy; create database immortal;"
          sudo mariadb -e "create user 'runner'@'localhost'; grant all on sneezy.* to 'runner'@'localhost'; grant all on immortal.* to 'runner'@'localhost';"
          for db in immortal sneezy ; do
            for phase in tables views data ; do
              [ -d "_Setup-data/sql_$phase/$db" ] || continue
              for sql in _Setup-data/sql_$phase/$db/*.sql ; do
                echo "loading '$sql'"
                mysql $db < $sql
              done
            done
          done

      - name: Restore cached build objects from master branch
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CMAKE_CACHE_PATHS }}
          key: ${{ runner.os }}-cmake-master-${{ hashFiles(env.CMAKE_CACHE_HASH_GLOBS) }}
          restore-keys: |
            ${{ runner.os }}-cmake-master-

      - name: Compile code
        uses: ./.github/actions/build-cmake
        with:
          preset: release-clang

      - name: Verify the game boots up successfully
        run: make verify
