name: SneezyMUD

on:
  # No workflow-level paths filters — see comments on individual steps for why.
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    name: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Notify Discord of new PR
        if: github.event.action == 'opened' && env.DISCORD_PR_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
        run: python .github/scripts/notify_discord.py new-pr

      # Categorize changed files so downstream steps can decide what to run.
      # Infrastructure = build system/packaging; gameplay = game code/data.
      #
      # Fails open: workflow_dispatch and unknown events build everything.
      #
      # Pins to specific SHA for security - some third-party actions were compromised
      # by a supply chain attack recently, which this protects against.
      - name: Identify changed files
        id: changes
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            infrastructure:
              - '**/CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'Dockerfile'
            gameplay:
              - 'code/code/**/*.cc'
              - 'code/code/**/*.h'
              - 'code/sneezy.cfg'
              - 'lib/**'
            tests:
              - 'tests/cpp/**'
            functional_tests:
              - 'tests/functional/**'

      - name: Restore cache and build
        id: build
        if: >-
          steps.changes.outputs.infrastructure == 'true' ||
          steps.changes.outputs.gameplay == 'true' ||
          steps.changes.outputs.tests == 'true' ||
          steps.changes.outputs.functional_tests == 'true'
        uses: ./.github/actions/cached-build

      # Only runs when a build actually happened (cache miss). On a cache
      # hit, nothing changed since the last run that already passed tests.
      # Uses ctest directly (not `make test`) to avoid re-running cmake
      # configure and build, which cached-build already did.
      - name: Run C++ unit tests
        if: steps.build.outputs.built == 'true'
        run: ctest --test-dir build/release-clang --output-on-failure

      # CI is a required status check, so the workflow must run on every PR.
      # A workflow-level paths filter would prevent it from reporting a status
      # at all, blocking merges for PRs that only touch non-build files.
      - name: Validate PR
        if: >-
          github.event_name == 'pull_request' &&
          (steps.changes.outputs.gameplay == 'true' ||
          steps.changes.outputs.functional_tests == 'true')
        uses: ./.github/actions/validate-pr

      # A workflow-level paths filter can't distinguish which pushes need a new
      # release — step-level filtering avoids publishing identical images when
      # only non-build files (e.g. docs, CI config) changed.
      - name: Publish new release
        if: >-
          github.ref == 'refs/heads/master' &&
          (steps.changes.outputs.infrastructure == 'true' ||
          steps.changes.outputs.gameplay == 'true')
        uses: ./.github/actions/release
        with:
          discord-webhook-url: ${{ secrets.DISCORD_NEW_BUILD_WEBHOOK_URL }}
          discord-admin-role-id: ${{ vars.DISCORD_ADMIN_ROLE_ID }}
          gameplay-changed: ${{ steps.changes.outputs.gameplay }}
