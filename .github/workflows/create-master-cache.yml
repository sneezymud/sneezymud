# Caches created via actions/cache are not shared between PRs. However, a cache
# created on a parent branch is accessible by a child branch, including PRs that
# are attempting to merge to the parent branch. Therefore, if we create a cache
# of the build files every time changes are pushed to master, new PRs should be
# able to utilize those during their compilation to enable incremental builds.
name: Create Master Branch Compilation Cache
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-cache-master
  cancel-in-progress: true

jobs:
  build_and_cache:
    runs-on: ubuntu-24.04
    name: Build and Cache
    steps:
      - name: Checkout this commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure cache settings
        uses: ./.github/actions/setup-cmake-cache

      - name: Determine cache key
        id: cache-key
        run: |
          cache_key="${{ runner.os }}-cmake-master-${{ hashFiles(env.CMAKE_CACHE_HASH_GLOBS) }}"
          echo "value=$cache_key" >> "$GITHUB_OUTPUT"
          echo "CMAKE_CACHE_KEY=$cache_key" >> "$GITHUB_ENV"

      - name: Install build prerequisites
        uses: ./.github/actions/install-build-deps

      # Use cached build objects from the previous master build, if available,
      # to avoid a full recompilation when no relevant sources changed.
      - name: Restore cached build objects
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CMAKE_CACHE_PATHS }}
          key: ${{ env.CMAKE_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-cmake-master-

      - name: Compile code
        uses: ./.github/actions/build-cmake
        with:
          preset: release-clang

      - name: Cache compilation results
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CMAKE_CACHE_PATHS }}
          # Use a unique key per cache based on a hash of the sources and CMake
          # files, because GitHub Actions caches are immutable and a new cache
          # will not overwrite an existing key. Using restore-keys in the
          # test.yml workflow allows the PR to fall back to the most recent
          # cache prefixed with ${{ runner.os }}-cmake-master-.
          key: ${{ env.CMAKE_CACHE_KEY }}
