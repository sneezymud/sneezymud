name: Validate PR
description: |
  Set up a test database, boot the game server, and run functional smoke tests.
runs:
  using: composite
  steps:
    - name: Install database server package
      shell: bash
      run: .github/scripts/install-packages.sh mariadb-server

    - name: Set up test database
      shell: bash
      run: ./db/init-db.sh

    - name: Start game server
      shell: bash
      run: ./scripts/start_server.sh

    - name: Run C++ tests
      shell: bash
      run: |
        if [ -d build/release-clang ]; then
          ctest --test-dir build/release-clang --output-on-failure
        else
          echo "Skipping C++ tests (no build directory; binary restored from cache)"
        fi

    - name: Set up bun
      uses: oven-sh/setup-bun@v2

    - name: Run functional smoke tests
      shell: bash
      env:
        MUD_ACCOUNT: testadmin
        MUD_CHARACTER: Testchar
        MUD_PASSWORD: 7estPw
      run: |
        cd tests/functional
        bun install --frozen-lockfile
        bun run harness/bootstrap-admin.ts
        bun run test:smoke

    - name: Stop game server
      if: always()
      shell: bash
      run: ./scripts/stop_server.sh ${{ job.status == 'failure' && '--dump-log' || '' }}
