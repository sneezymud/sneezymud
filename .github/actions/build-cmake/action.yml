name: Build with CMake
description: Configure and build project using CMake presets with ccache
inputs:
  preset:
    description: CMake preset to use
    required: false
    default: release-clang
runs:
  using: composite
  steps:
    - name: Configure ccache
      shell: bash
      run: ccache --zero-stats

    - name: Configure
      shell: bash
      run: cmake --preset "${{ inputs.preset }}"

    - name: Build
      shell: bash
      run: cmake --build --preset "${{ inputs.preset }}"

    - name: Show ccache stats
      shell: bash
      if: always()
      run: ccache --show-stats
