name: Install build dependencies
inputs:
  extra-packages:
    description: Additional apt packages to install
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -e
        sudo apt-get update
        export DEBIAN_FRONTEND=noninteractive
        packages="build-essential cmake ninja-build mold libboost1.83-dev libboost-program-options1.83-dev libboost-regex1.83-dev libboost-filesystem1.83-dev libboost-system1.83-dev libmariadb-dev libcurl4-openssl-dev ca-certificates pkgconf"
        if [ -n "${EXTRA_PACKAGES}" ]; then
          packages="${packages} ${EXTRA_PACKAGES}"
        fi
        TZ=utc sudo apt-get install --yes --no-install-recommends ${packages}
