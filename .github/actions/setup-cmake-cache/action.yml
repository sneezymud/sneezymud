name: Setup CMake cache environment
description: Configure environment variables for CMake build caching
runs:
  using: composite
  steps:
    - name: Set cache paths and hash globs
      shell: bash
      run: |
        # Paths to cache:
        # - build/: CMake build directory with compiled objects
        # - ~/.cache/ccache: ccache directory (content-addressed, survives timestamp changes)
        {
          echo "CMAKE_CACHE_PATHS<<EOF"
          echo "build/"
          echo "$HOME/.cache/ccache"
          echo "EOF"
        } >> "$GITHUB_ENV"

        # Files that affect the build - if any of these change, cache should be invalidated
        # Includes CMake files, source files, and headers
        # Note: hashFiles() requires newline-separated patterns, not space-separated
        {
          echo "CMAKE_CACHE_HASH_GLOBS<<EOF"
          echo "CMakeLists.txt"
          echo "CMakePresets.json"
          echo "cmake/**"
          echo "code/CMakeLists.txt"
          echo "code/code/CMakeLists.txt"
          echo "code/code/**/*.cc"
          echo "code/code/**/*.h"
          echo "EOF"
        } >> "$GITHUB_ENV"
